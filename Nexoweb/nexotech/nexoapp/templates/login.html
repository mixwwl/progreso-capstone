{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - NexoTech</title>
  <link rel="stylesheet" href="{% static 'stylelogin.css' %}" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
</head>
<body>
  <div class="container">
    <form method="post">
      {% csrf_token %}
      <h1>Iniciar Sesión</h1>

      <!-- Mensajes -->
      {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <!-- Campo Email -->
      <div class="input-box">
        <input type="email" name="username" placeholder="Correo electrónico" required>
        <i class="bx bxs-envelope"></i>
      </div>

      <!-- Campo Contraseña -->
      <div class="input-box">
        <input type="password" name="password" placeholder="Contraseña" required>
        <i class="bx bxs-lock-alt"></i>
      </div>

      <div class="remember-forgot">
        <a href="{% url 'recuperacion' %}">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn">Entrar</button>

      <div class="register-link">
        <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
      </div>
    </form>
  </div>
</body>
</html>
